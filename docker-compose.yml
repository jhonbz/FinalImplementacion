services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - uploads_data:/app/uploads
      - ollama_data:/root/.ollama
    env_file:
      - ./backend/.env
    restart: unless-stopped

volumes:
  chroma_data:
  uploads_data:
  ollama_data:
